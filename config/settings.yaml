# 동작 파라미터 (docs/ARCHITECTURE.md §5)
hardware: sim            # sim | pi — 환경변수 LEAKMON_HW가 있으면 그 값이 우선
device_id: press-01      # 이 장치의 ID (config/devices.yaml에 등록된 값)
sample_period_s: 1.0     # 샘플 주기 (실제 시간, 초)
time_scale: 1440         # 배속: 시연 1분 = 가상 운전 1일
db_path: data/leakmon.db # 저장소 루트 기준 상대 경로

# 4단계 보안: TLS + 계정 (bash broker/setup.sh로 인증서·계정 생성, mosquitto -c broker/mosquitto.conf로 실행)
mqtt:
  host: localhost        # 인증서 SAN에 있는 이름이어야 함 (localhost, 이 PC/Pi 이름, 127.0.0.1)
  port: 8883
  ca_file: broker/certs/ca.crt  # 브로커 인증서를 확인할 CA (저장소 루트 기준)

# 상태 머신: 임계값은 이상 점수 기준, 지속 시간은 "가상 시간(분)"
# ×1440 배속에서 샘플 1개 = 가상 24분 → 120분은 샘플 5개 연속
state:
  t1: 0.5                # 주의 임계값
  t2: 1.0                # 점검권고 임계값
  d1_min: 120            # 주의 확정 지속 시간
  d2_min: 240            # 점검권고 확정 지속 시간
  recover_min: 120       # 주의 → 정상 회복 지속 시간
  fault_after_min: 60    # 데이터 미수신 시 센서장애 판정 시간
  spike_window_min: 1440 # 순간 튐 반복 판정 기간 (TBD-01 결정: 24시간)
  spike_count: 3         # 기간 안에 이 횟수 이상이면 주의 (TBD-01 결정: 3회)

# 1단계 임시 점수 (고정 기준값): score = (측정 - normal) / (alarm - normal)
baseline:
  normal_mA: 4.5
  alarm_mA: 9.0

# 3단계 AI (선형 회귀 + 잔차). 아래 두 값은 임시값
ai:
  method: linear         # linear = 선형 회귀 + 잔차 (제안) | baseline = 고정 임계값 (비교용)
  model_path: models/linear.json  # 학습 결과 저장 위치 (SYS-15a)
  learn_days: 1          # 학습 기간 (TBD-02). 모든 시나리오의 첫 1일이 정상이라 1일로 시작
  sigma_scale: 10        # 점수 1.0 = 잔차가 σ의 10배 (TBD-04: T1·T2를 그대로 쓰면 주의 5σ, 점검권고 10σ)

web:
  port: 8000
