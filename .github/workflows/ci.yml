name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest --cov=leakmon --cov=web

      # 핵심 판정 로직은 분기 100% 유지 (테스터 결정 A안, docs/TEST.md 5장). 위 단계가 만든 .coverage를 다시 읽는다
      - name: Coverage gate (state.py 100%)
        run: coverage report --include=src/leakmon/state.py --fail-under=100
