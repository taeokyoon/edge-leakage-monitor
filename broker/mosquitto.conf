# leakmon 브로커 (4단계 보안, docs/ARCHITECTURE.md 4장, SYS-13a~c)
# 준비: bash broker/setup.sh (인증서·계정 생성) → 실행: mosquitto -c broker/mosquitto.conf (저장소 루트에서)

# SYS-13a 암호화: TLS 포트만 연다 (평문 1883 없음)
listener 8883
cafile broker/certs/ca.crt
certfile broker/certs/server.crt
keyfile broker/certs/server.key

# SYS-13b 인증: 계정 없는 접속 거부, 장치별 ID/비밀번호
allow_anonymous false
password_file broker/passwd

# SYS-13c 권한: 장치는 자기 토픽에만 발행
acl_file broker/acl

# 거부 기록(보안 시연 증거)이 보이도록 debug까지 출력
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type debug
