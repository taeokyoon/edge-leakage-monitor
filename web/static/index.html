<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>leakmon 대시보드</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f4f5f7; color: #222; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .scale { color: #666; font-size: 14px; margin-bottom: 16px; }
    .device { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; max-width: 900px; }
    .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .location { color: #666; font-size: 14px; }
    .badge { padding: 4px 10px; border-radius: 12px; font-weight: bold; color: #fff; }
    .normal { background: #2e7d32; } .caution { background: #f9a825; }
    .inspect { background: #c62828; } .fault { background: #616161; } .unknown { background: #9e9e9e; }
    .online { color: #2e7d32; } .offline { color: #c62828; }
    .metrics { display: flex; gap: 24px; flex-wrap: wrap; margin: 12px 0; font-size: 14px; }
    .metrics b { font-size: 18px; display: block; }
    button { background: #c62828; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
    .alerts { font-size: 13px; max-height: 160px; overflow-y: auto; padding-left: 18px; }
  </style>
</head>
<body>
  <h1>누설전류 추세 감시</h1>
  <div class="scale" id="scale"></div>
  <div id="devices"></div>

  <!-- 장치 패널 틀: app.js가 장치마다 복사해서 채운다 -->
  <template id="device-template">
    <section class="device">
      <div class="head">
        <div>
          <strong class="equipment"></strong> <span class="conn"></span>
          <div class="location"></div>
        </div>
        <span class="badge unknown">-</span>
      </div>
      <div class="metrics">
        <div>누설전류<b class="leakage">-</b></div>
        <div>예상값<b class="expected">-</b></div>
        <div>습도<b class="humidity">-</b></div>
        <div>이상 점수<b class="score">-</b></div>
        <div>가상 시간<b class="ts">-</b></div>
        <div>시나리오<b class="scenario">-</b></div>
      </div>
      <button class="ack" hidden>점검 확인 (ack)</button>
      <canvas height="110"></canvas>
      <h4>알림 이력</h4>
      <ul class="alerts"></ul>
    </section>
  </template>

  <!-- Chart.js 4.4.1 로컬 사본 (CDN을 못 받는 브라우저·인터넷 없는 시연장에서도 동작하도록) -->
  <script src="/static/chart.umd.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
