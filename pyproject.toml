[project]
name = "leakmon"
version = "0.1.0"
description = "누설전류 추세 감시 시스템 (저전압 PoC)"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    # 모델은 PC에서 학습해 Pi에서 불러오므로 버전을 정확히 고정 (버전이 다르면 로드를 보장하지 않음)
    "scikit-learn==1.9.1",
    "numpy==2.4.6",  # 2.5부터 Python 3.11 미지원 → Pi OS(3.11 또는 3.13) 어느 쪽이든 설치되도록
]

[project.optional-dependencies]
# PC 전용: 테스트, 데이터셋 생성·학습·평가 도구
dev = ["pytest>=8", "pandas>=3.0", "pytest-cov", "ruff", "mypy", "types-PyYAML"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# 정적분석 (docs/TEST.md §3)
[tool.ruff]
line-length = 120  # 기존 코드가 한 줄에 주석을 붙이는 스타일이라 기본 88보다 넓게

[tool.ruff.lint]
# E 코딩 규칙, F 오류 패턴, B 버그 유발 패턴, SIM 단순화, UP 구문 최신화, S 보안(bandit 규칙)
select = ["E", "F", "B", "SIM", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest는 assert로 검증하므로 테스트 파일에서만 허용

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["paho.*", "sklearn.*"]
ignore_missing_imports = true  # paho-mqtt·scikit-learn에 타입 정보가 없을 때 대비